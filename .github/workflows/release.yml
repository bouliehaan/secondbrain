# Builds the install file people actually use: one .deb, attached to the release.
#
# secondbrain cannot be a container -- it drives a real display through a real X
# session, the same reason samo-radio cannot be one. The package is the install
# path.
#
# Architecture: all. There is no compile step; everything shipped is JavaScript,
# Python or config.

name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: Tag to build a release for
                required: true

permissions:
    contents: write

jobs:
    gates:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.21.1'
            - run: make check-all

    release:
        needs: gates
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.21.1'

            - name: Work out the version
              id: version
              run: |
                  raw="${{ github.event.inputs.tag || github.ref_name }}"
                  echo "tag=${raw}" >> "$GITHUB_OUTPUT"
                  # Debian versions do not carry the leading v.
                  echo "deb=${raw#v}" >> "$GITHUB_OUTPUT"

            - name: Build the package
              env:
                  VERSION: ${{ steps.version.outputs.deb }}
              run: packaging/build-deb.sh

            - name: Check the packages are well formed
              run: |
                  set -euo pipefail
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq lintian
                  for arch in amd64 arm64 armhf; do
                      deb="dist/secondbrain_${arch}.deb"
                      echo "== $deb"
                      dpkg-deb --info "$deb"
                      lintian --no-tag-display-limit "$deb" || true
                      dpkg-deb --field "$deb" Version \
                          | grep -qx "${{ steps.version.outputs.deb }}"
                      dpkg-deb --field "$deb" Architecture | grep -qx "$arch"
                      contents="$(dpkg-deb --fsys-tarfile "$deb" | tar -tf -)"
                      for path in \
                          ./usr/bin/secondbrain-server \
                          ./usr/bin/calendar-kiosk \
                          ./usr/bin/magicmirror-python-clock.py \
                          ./usr/lib/secondbrain/node/bin/node \
                          ./lib/systemd/system/magicmirror.service \
                          ./etc/lightdm/lightdm.conf.d/50-calendar-kiosk.conf \
                          ./usr/share/secondbrain/openbox/autostart \
                          ./usr/share/secondbrain/config.example.js \
                          ./usr/share/secondbrain/seed-config.py \
                          ./opt/MagicMirror/serveronly/index.js \
                          ./opt/MagicMirror/js/app.js \
                          ./opt/MagicMirror/node_modules/eslint/lib/config/default-config.js \
                          ./opt/MagicMirror/css/secondbrain.css \
                          ./opt/MagicMirror/modules/MMM-CalendarExt3/MMM-CalendarExt3.js \
                          ./opt/MagicMirror/modules/MMM-CalendarExt3Agenda/MMM-CalendarExt3Agenda.js \
                          ./opt/MagicMirror/modules/MMM-SecondBrain/node_helper.js \
                          ./opt/MagicMirror/modules/MMM-SecondBrain/node_modules/imapflow/package.json \
                          ./usr/share/secondbrain/examples/gmail/accounts/personal.example.json \
                          ./usr/share/secondbrain/examples/proton/accounts/personal.example.json
                      do
                          case "$contents" in
                              *"$path"*) ;;
                              *) echo "$deb is missing $path" >&2; exit 1 ;;
                          esac
                      done
                      case "$contents" in
                          *./opt/MagicMirror/config/*)
                              echo "$deb would write into the live config directory" >&2; exit 1 ;;
                      esac
                      if printf '%s\n' "$contents" | grep -q 'node_modules/electron/'; then
                          echo "$deb contains electron; --omit=optional was lost" >&2
                          exit 1
                      fi
                      if printf '%s\n' "$contents" | grep -qE '/secondbrain/[a-z-]+\.json$'; then
                          echo "$deb carries a non-example credential file" >&2; exit 1
                      fi
                  done

            # Everything above reads the archive. This installs it the way the
            # README says, on a box with nothing set up, and requires the wall
            # to answer. 1.1.0 and 1.2.0 both passed every check above and
            # crash-looped on every fresh install.
            - name: Install and boot
              run: packaging/smoke-install.sh dist/secondbrain_amd64.deb

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ steps.version.outputs.tag }}" dist/*.deb --clobber \
                      || gh release create "${{ steps.version.outputs.tag }}" dist/*.deb \
                           --title "secondbrain ${{ steps.version.outputs.tag }}" --generate-notes
